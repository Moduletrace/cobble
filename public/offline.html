:root {
    --paper: #fbfaf7;
    --ink: #0e1116;
    --ink-secondary: #5b6470;
    --hairline: #e8e4dc;
    color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
    :root {
        --paper: #12151a;
        --ink: #f4f2ec;
        --ink-secondary: #9ca5b0;
        --hairline: #2b3138;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));

    color: var(--ink);
    font-family: "Archivo", "Liberation Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
}
main {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
}
h1 {
    margin: 8px 0 0;
    font-size: 28px;
    line-height: 1.1;
    letter-spacing: -0.03em;
}
p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-secondary);
}
button {
    margin-top: 12px;
    height: 40px;
    padding: 0 18px;
    border: 0;
    border-radius: 8px;
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
